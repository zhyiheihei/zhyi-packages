name: update

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh nvfetcher sources
        run: nix run nixpkgs#nvfetcher -- -c nvfetcher.toml -o helpers/_sources
      - name: Flake check
        run: nix flake check
      - name: Open update PR
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "no source changes"
            exit 0
          fi
          branch="auto-update-$(date +%Y%m%d%H%M)"
          git config user.name "zhyi-packages bot"
          git config user.email "zhyiheihei+bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: refresh nvfetcher sources"
          git push -u origin "$branch"
          gh pr create \
            --title "chore: refresh package sources" \
            --body "Automated nvfetcher update. Merge after CI passes." || true

