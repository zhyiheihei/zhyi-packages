name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Flake check
        run: nix flake check
      - name: Build vaults3 (x86_64-linux)
        run: nix build .#packages.x86_64-linux.vaults3
